<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="brand">Transcription</p>
        <h1>Upload or record. Get speakers, timestamps, and a summary.</h1>
        <p class="lede">
          Paste your API key, then upload a file or record from your microphone.
        </p>
      </header>

      <form id="upload-form" class="form" novalidate>
        <label class="field">
          <span>API key</span>
          <input
            id="api-key"
            name="api_key"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="Bearer token from the server .env"
            required
          />
        </label>

        <div class="source">
          <label class="field grow">
            <span>Audio or video file</span>
            <input
              id="file"
              name="file"
              type="file"
              accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.mp4"
            />
          </label>

          <div class="record-box">
            <span class="record-label">Or microphone</span>
            <div class="record-actions">
              <button id="record-btn" type="button" class="ghost">Start recording</button>
              <button id="clear-recording" type="button" class="ghost" hidden>Clear clip</button>
            </div>
            <p id="record-status" class="record-status">No recording yet</p>
            <audio id="preview" controls hidden></audio>
          </div>
        </div>

        <div class="row">
          <label class="field grow">
            <span>Language <em>(optional)</em></span>
            <input
              id="language"
              name="language"
              type="text"
              maxlength="8"
              placeholder="en, fa, auto if blank"
            />
          </label>
          <label class="check">
            <input id="summarize" name="summarize" type="checkbox" checked />
            <span>Summarize</span>
          </label>
          <label class="check">
            <input id="diarize" name="diarize" type="checkbox" checked />
            <span>Speakers</span>
          </label>
        </div>

        <div class="actions">
          <button id="submit" type="submit">Transcribe</button>
          <button id="copy" type="button" class="ghost" hidden>Copy transcript</button>
        </div>
      </form>

      <section id="progress-panel" class="progress-panel" hidden>
        <div class="progress-head">
          <p id="status" class="status-line"></p>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-detail" class="progress-detail"></p>
      </section>
      <p id="error" class="error" hidden></p>

      <section id="results" class="results" hidden>
        <div id="summary-block" class="summary" hidden>
          <h2>Summary</h2>
          <p id="summary-text"></p>
        </div>
        <div class="transcript">
          <h2>Transcript</h2>
          <ol id="segments"></ol>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
