name: transcription

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-transcription-env: &transcription-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_SECURE: "false"
  API_KEY: ${API_KEY}
  HF_TOKEN: ${HF_TOKEN:-}
  WHISPER_MODEL: ${WHISPER_MODEL:-medium}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}
  WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-4}
  MIN_FREE_VRAM_MB: ${MIN_FREE_VRAM_MB:-4096}
  DIARIZE_MODEL: ${DIARIZE_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
  MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-20}
  HF_HOME: /cache/huggingface
  HUGGINGFACE_HUB_CACHE: /cache/huggingface
  HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
  NLTK_DATA: /cache/nltk
  WHISPER_DOWNLOAD_ROOT: /cache/whisper

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: transcription-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-1139}:80"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
    depends_on:
      transcription-api:
        condition: service_healthy
    networks:
      - internal
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: transcription-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    logging: *logging

  minio:
    image: minio/minio:latest
    container_name: transcription-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal
    logging: *logging

  transcription-api:
    build: ./transcription
    image: transcription:local
    container_name: transcription-api
    restart: unless-stopped
    environment:
      <<: *transcription-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    logging: *logging

  transcription-worker:
    build: ./transcription
    image: transcription:local
    container_name: transcription-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    gpus: all
    shm_size: "2gb"
    environment:
      <<: *transcription-env
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model_cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - internal
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:

networks:
  internal:
    driver: bridge
